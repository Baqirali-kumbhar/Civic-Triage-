<style>

.card:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(0,0,0,.34)}.auth{border-top-color:var(--gd)}main .card{box-shadow:0 6px 20px rgba(90,11,15,.1)}main .card:hover{transform:none;box-shadow:0 8px 24px rgba(90,11,15,.16)}

.fi{position:relative}.fi svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mut);transition:.25s;pointer-events:none}.fi:focus-within svg{color:var(--rd);transform:translateY(-50%) scale(1.2)}
.fi input{padding-left:40px}.fi input[data-pw]{padding-right:58px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--rd);font:800 12px Nunito;cursor:pointer;padding:6px 8px}

.btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 10px 20px rgba(163,18,26,.32)}.btn:active{transform:scale(.95)}.btn.ghost{background:#efe6d2;color:var(--in)}.btn.in{background:linear-gradient(135deg,#5a0b0f,#2b0508)}.btn.sm{padding:5px 10px;font-size:12px}.btn.del{background:#fff;color:var(--rd);border:1.5px solid var(--rd)}.btn.full{width:100%;padding:14px;font-size:16px}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .6s ease-out;pointer-events:none}@keyframes rp{to{transform:scale(2.8);opacity:0}}

.hw{padding-left:20px;margin:0}.hw li{margin:8px 0;color:#4a3f55}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}

.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 62px)}@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static!important;flex-direction:row!important;overflow:auto;height:auto!important}}
aside{background:linear-gradient(rgba(43,5,8,.9),rgba(43,5,8,.95));padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:62px;height:calc(100vh - 62px)}
aside button{background:none;border:0;color:#e5d6d6;text-align:left;padding:11px 14px;border-radius:10px;font:700 14px Nunito;cursor:pointer;transition:.2s;white-space:nowrap}aside button:hover{background:rgba(255,255,255,.12);transform:translateX(3px)}aside button.on{background:linear-gradient(135deg,var(--rd),#7a0c12);color:#fff}
main{background:var(--cr);padding:20px;min-width:0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--ln);border-left:6px solid var(--rd);border-radius:12px;padding:14px;animation:up .5s both;transition:transform .2s,box-shadow .2s}.stat:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 10px 22px rgba(90,11,15,.16)}.stat:nth-child(even){border-left-color:var(--gd)}.stat b{font:30px Marcellus;display:block;color:var(--in)}.stat span{font-size:12px;color:var(--mut);font-weight:700}
.charts{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.wide{grid-column:span 2}@media(max-width:700px){.wide{grid-column:auto}}.cb{height:260px;position:relative}.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-weight:700}.empty[hidden]{display:none}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#166534}.live:before{content:"";width:9px;height:9px;border-radius:50%;background:#22c55e;animation:pulse 1.4s infinite}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--mut);padding:8px;background:#f6edd9}td{padding:9px 8px;border-top:1px solid var(--ln);vertical-align:top}tbody tr{transition:background .15s}tbody tr:hover{background:#fff8ea}.sc{overflow-x:auto}td .btn{margin:2px 2px 0 0}
.flt{margin-bottom:10px}.flt>*{flex:1 1 140px}.bulk{display:none;gap:8px;align-items:center;flex-wrap:wrap;background:#fff3c4;border:1px solid #e8d48a;border-radius:10px;padding:8px 12px;margin-bottom:10px}.bulk.show{display:flex;animation:up .3s both}
.ev{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--ln);font-size:13px;flex-wrap:wrap}.ev>span:not(.tag){flex:1;min-width:160px}.ev small{color:var(--mut)}
.tl{border-left:3px solid var(--ln);margin:10px 0 0 7px;padding-left:16px}.tl div{position:relative;padding-bottom:12px;font-size:13px}.tl div:before{content:"";position:absolute;left:-23px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--rd);border:2px solid #fff;box-shadow:0 0 0 2px var(--rd)}.tl img,.pv{max-width:100%;max-height:170px;border-radius:10px;margin-top:6px;display:block}
.msg{padding:10px 14px;border-radius:10px;margin-top:10px;font-size:14px;animation:up .3s both}.ok{background:#dff5e6;color:#166534}.err{background:#fde2e2;color:#991b1b}.warn{background:#fff3c4;color:#8a6a00}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.4);animation:pop .35s both}dialog::backdrop{background:rgba(43,5,8,.65)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--in);color:#fff}.mh h3{margin:0;font-size:20px}.mh .x{background:none;border:0;color:#fff;cursor:pointer;font:700 13px Nunito}.mb{padding:6px 20px}.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px}.me{padding:0 20px}
.cats{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.cat{border:1px solid var(--ln);border-radius:12px;padding:14px;background:#fffdf8;border-top:5px solid var(--rd);transition:transform .2s}.cat:hover{transform:translateY(-4px)}.cat:nth-child(even){border-top-color:var(--gd)}.chip{display:inline-block;background:#efe6d2;border-radius:6px;padding:1px 7px;font-size:11px;margin:2px 2px 0 0}
.bar{height:7px;background:var(--ln);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--in),var(--rd));animation:gr 1s both;transform-origin:left}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--gd)}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.map{height:330px;border-radius:12px;border:2px solid var(--ln);margin-top:8px;z-index:0}.map.big{height:min(68vh,620px)}.hint{font-size:12px;color:var(--mut);margin:4px 0}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes gr{from{transform:scaleX(0)}}@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(34,197,94,0)}0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}}@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="brand"><i>سنڌ</i>Sindh Civic Triage</div><div class="who" id="who"></div></header><div id="A"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),PAL=['#a3121a','#1f1f1f','#d9a441','#0f766e','#6b2d5c','#e07a5f','#4b5563'];
const ROLE={admin:'Administrator',manager:'Manager / Controller',staff:'Field Attender',citizen:'Citizen'};
let tok=localStorage.tok||'',me=null,D={items:[],stats:{}},USERS=[],CATS=[],RULES={},cur='',timer,F={q:'',st:'',ct:'',pr:'',so:'p'},charts={},photoD=null;
const api=async(u,m='GET',b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json','x-token':tok},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch{}if(r.status===401&&tok){logout()}if(!r.ok)throw new Error(j.error||'Request failed');return j};
const ago=t=>{const m=(Date.now()-t)/6e4;return m<60?Math.max(1,~~m)+' min ago':m<1440?~~(m/60)+' h ago':~~(m/1440)+' d ago'};
const st=s=>`<span class="tag ${s==='In Progress'?'Progress':s}">${s}</span>`,pr=c=>`<span class="tag ${c.priority}">${c.priority} ${c.priorityScore}</span>`;
const th=i=>i.photo?`<img class="av" style="border-radius:10px" src="${i.photo}" alt="">`:'';
function shrink(f,m=900){return new Promise(r=>{const i=new Image;i.onload=()=>{const s=Math.min(1,m/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};i.src=URL.createObjectURL(f)})}
function modal(title,body,onSave,label='Save'){const d=document.createElement('dialog');d.innerHTML=`<div class="mh"><h3>${title}</h3><button class="x">Close</button></div><div class="mb">${body}</div><div class="me"></div><div class="mf"><button class="btn ghost" data-c>Cancel</button>${onSave?`<button class="btn" data-s>${label}</button>`:''}</div>`;document.body.appendChild(d);
 const close=()=>d.close();d.querySelector('.x').onclick=d.querySelector('[data-c]').onclick=close;d.addEventListener('close',()=>d.remove());
 if(onSave)d.querySelector('[data-s]').onclick=async()=>{try{await onSave(d);close()}catch(x){d.querySelector('.me').innerHTML=`<div class="msg err">${e(x.message)}</div>`}};d.showModal();return d}
const val=(d,s)=>d.querySelector(s).value,file=async(d,s)=>{const f=d.querySelector(s).files[0];return f?await shrink(f):null};
function logout(){tok='';localStorage.tok='';me=null;render()}
async function boot(){if(tok){try{me=(await api('/api/me')).user}catch{tok='';localStorage.tok=''}}render()}
function render(){clearInterval(timer);document.body.classList.toggle('pub',!me||me.role==='citizen');const w=$('#who');w.innerHTML=me?`${me.photo?`<img src="${me.photo}" alt="">`:''}<span><b>${e(me.name)}</b><br>${ROLE[me.role]}</span><button class="btn ghost sm" id="lo">Log out</button>`:'';if(me)$('#lo').onclick=logout;
 me?(me.role==='citizen'?citizen('new'):staff()):guest()}
/* ---------- GUEST ---------- */
const IC={user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',id:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4M14 14h4M6 17c0-2 6-2 6 0"/>',phone:'<path d="M5 3h4l2 5-2.5 1.5a11 11 0 006 6L16 13l5 2v4a2 2 0 01-2 2A16 16 0 013 5a2 2 0 012-2z"/>',pin:'<path d="M12 22s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',tag:'<path d="M3 12l9-9h8v8l-9 9z"/><circle cx="16" cy="8" r="1.5"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>'};
const svg=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const fld=(lab,id,ic,a='',ty='text')=>`<div class="fg"><label for="${id}">${lab}</label><div class="fi">${svg(ic)}<input id="${id}" type="${ty}" ${ty=='password'?'data-pw':''} ${a}>${ty=='password'?`<button type="button" class="eye" data-e="${id}">Show</button>`:''}</div></div>`;
const NIC='inputmode="numeric" maxlength="13" data-num placeholder="13 digits, numbers only"',PHN='inputmode="numeric" maxlength="11" data-num placeholder="11 digits, e.g. 03001234567"';
function guest(){$('#A').innerHTML=`<section class="hero"><h1>Your voice for a better <b>Sindh</b>.</h1><p>Report broken roads, streetlights, water leaks, garbage and drains. Verified citizens, smart priority, and a public trail to the fix.</p></section>
<div class="wrap"><div class="g2"><div class="card auth" id="auth"></div><div><div class="card"><h2>Track a complaint</h2><div class="row"><input id="tid" placeholder="CMP-1001"><button class="btn in" id="tb" style="flex:0">Track</button></div><div id="tr"></div></div><div class="card"><h2>Before you start</h2><ol class="hw"><li>Register once. Your NIC, email and phone can be used for one account only.</li><li>Add a clear photo and mark the exact spot on the map.</li><li>Save your complaint ID (like CMP-1001) and enter it above to follow up.</li></ol></div></div></div></div>`;auth('login');$('#tb').onclick=()=>track($('#tid').value,$('#tr'))}
function auth(m){const c=$('#auth');photoD=null;const T=`<div class="tabs"><button data-m="login" class="${m=='login'?'on':''}">Log in</button><button data-m="reg" class="${m=='reg'?'on':''}">Register</button></div>`,H=(i,t,x)=>`<div class="ah">${svg(i)}<div><h2>${t}</h2><small>${x}</small></div></div>`,pw=(l,i,a)=>fld(l,i,'lock',a,'password');
 c.innerHTML=T+(m=='login'?H('user','Welcome back','Log in with your NIC, email or staff username')+`<div class="stag">${fld('NIC, email or username','l','user','autocomplete="username"')}${pw('Password','p','autocomplete="current-password"')}<div class="row" style="align-items:center;margin-top:16px;flex-wrap:nowrap"><button class="btn" id="go" style="flex:0 0 auto;padding:11px 28px">Log in</button><a href="#" class="lnk" id="fg">Forgot password?</a></div><div id="o"></div></div>`
 :m=='reg'?H('id','Create your account','One account per person: NIC, email and phone must be unique.')+`<div class="stag"><div class="row">${fld('Full name','n','user')}${fld('Caste','ca','tag')}</div><div class="row">${fld('Area / town','ar','pin')}${fld('Email','em','mail','autocomplete="email"','email')}</div><div class="row">${fld('NIC number','ni','id',NIC)}${fld('Phone number','ph','phone',PHN)}</div><div class="fg"><label>Profile photo</label><input type="file" id="pf" accept="image/*"><img id="pp" class="pv" hidden></div><div class="row">${pw('Password (6+ characters)','p','autocomplete="new-password"')}${pw('Confirm password','p2','autocomplete="new-password"')}</div><div class="meter"><i id="mt"></i></div><button class="btn full" id="go" style="margin-top:14px">Create account</button><div id="o"></div></div>`
 :H('key','Reset your password','We email a 6-digit code to your registered address')+`<div class="stag">${fld('Email or NIC','fe','mail')}<button class="btn" id="go" style="margin-top:14px">Send code</button><div id="o"></div><div id="rs" hidden>${fld('6-digit code','rc','key','inputmode="numeric" maxlength="6" data-num placeholder="123456"')}${pw('New password','rp','autocomplete="new-password"')}<button class="btn full" id="rb" style="margin-top:14px">Set new password</button><div id="o2"></div></div><p><a href="#" class="lnk" id="bk" style="margin:0">Back to log in</a></p></div>`);
 c.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>auth(b.dataset.m));
 c.querySelectorAll('.eye').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.e);i.type=i.type=='password'?'text':'password';b.textContent=i.type=='password'?'Show':'Hide'});
 c.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',x=>{if(x.key=='Enter'){x.preventDefault();const g=$(m=='fg'&&!$('#rs').hidden?'#rb':'#go');g&&g.click()}}));
 const lk=(id,to)=>$(id)&&($(id).onclick=x=>{x.preventDefault();auth(to)});lk('#fg','fg');lk('#bk','login');const err=(x,id='#o')=>$(id).innerHTML=`<div class="msg err">${e(x.message)}</div>`;
 if(m=='reg'){$('#pf').onchange=async x=>{photoD=await shrink(x.target.files[0],400);$('#pp').src=photoD;$('#pp').hidden=false};
  $('#p').oninput=x=>{const v=x.target.value,k=(v.length>=6)+(v.length>=10)+(/[A-Z]/.test(v)&&/[a-z]/.test(v))+/\d/.test(v)+/[^\w]/.test(v);$('#mt').style.width=k*20+'%';$('#mt').style.background=k<2?'#c2410c':k<4?'#d9a441':'#2f855a'}}

function mk(id,type,labels,vals,o,f){const em=!vals.some(x=>x>0);$('#e'+id).hidden=!em;charts[id]&&charts[id].destroy();if(em||!window.Chart)return;const lg=type=='doughnut'||type=='polarArea',cl=o.cols||PAL;
